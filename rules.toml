category = "PromptInjection"
severity = "High"
detection_method = "Regex"
pattern = "(?i)(ignore|disregard|forget|bypass).{0,50}(previous|all|the|current).{0,50}(instructions|directions|prompts|rules|protections)"
enabled = true

[[rules]]
