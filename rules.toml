# --- PII & Data Protection (30 Rules) ---

[[rules]]
name = "SSN Pattern Detection"
category = "PIILeakage"
severity = "Critical"
detection_method = "Regex"
pattern = "\\b\\d{3}-\\d{2}-\\d{4}\\b"
enabled = true

[[rules]]
name = "Credit Card Discovery"
category = "PIILeakage"
severity = "Critical"
detection_method = "Regex"
pattern = "\\b(?:\\d[ -]?){13,16}\\b"
enabled = true

[[rules]]
name = "API Key Leakage (Generic)"
category = "PIILeakage"
severity = "High"
detection_method = "Regex"
pattern = "(?i)(api[_-]key|secret[_-]key|access[_-]token)['\"]?\\s*[:=]\\s*['\"]?[a-zA-Z0-9]{20,}"
enabled = true

[[rules]]
name = "Private Key Extraction"
category = "PIILeakage"
severity = "Critical"
detection_method = "Regex"
pattern = "(?i)-----BEGIN\\s+(RSA|EC|PRIVATE)\\s+KEY-----"
enabled = true

[[rules]]
name = "Credential Harvesting"
category = "PIILeakage"
severity = "High"
detection_method = "Regex"
pattern = "(?i)(password|passwd|pwd|login|user|username)['\"]?\\s*[:=]\\s*['\"]?[a-zA-Z0-9]{6,}"
enabled = true

[[rules]]
name = "Email Pattern Detection"
category = "PIILeakage"
severity = "Medium"
detection_method = "Regex"
pattern = "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"
enabled = true

[[rules]]
name = "AWS Key Detection"
category = "PIILeakage"
severity = "Critical"
